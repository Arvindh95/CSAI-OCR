limit_req_zone $http_x_api_key     zone=csai_per_key:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=csai_per_ip:10m  rate=100r/m;

# Cache Streamlit's /media/ assets. Streamlit's MediaFileManager evicts
# these files within ~2 s of the first request, racing the browser's
# follow-up requests (validation, range probes, re-decodes). Caching
# them at the nginx layer makes the file durable past that GC window.
proxy_cache_path /var/cache/nginx/csai-media levels=1:2
                 keys_zone=csai_media:10m max_size=500m
                 inactive=30m use_temp_path=off;

server {
    listen 80;
    server_name 173.212.247.3;

    access_log /var/log/nginx/csai-ocr.access.log;
    error_log  /var/log/nginx/csai-ocr.error.log;

    # Client API (versioned). Phase 4 wires /api/v1/* routes; 404 until then.
    location /api/v1/ {
        limit_req zone=csai_per_key burst=20 nodelay;
        limit_req zone=csai_per_ip  burst=30 nodelay;

        proxy_pass         http://127.0.0.1:8003/api/v1/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Request-Id $request_id;
        proxy_read_timeout 30s;
        client_max_body_size 20M;
    }

    # Legacy endpoints (current main.py). Remove after Phase 4 cutover.
    location ~ ^/(ocr|verify|health)$ {
        limit_req zone=csai_per_ip burst=30 nodelay;
        proxy_pass         http://127.0.0.1:8003;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 20M;
    }

    # Admin API — IP allowlist + app-level token (app token added Phase 5).
    location /admin/v1/ {
        allow 127.0.0.1;
        deny  all;

        proxy_pass         http://127.0.0.1:8003/admin/v1/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Request-Id $request_id;
        client_max_body_size 1M;
    }

    # FastAPI docs — allowlist only (leaks endpoint list).
    location ~ ^/(docs|redoc|openapi\.json)$ {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8003;
    }

    # Prometheus metrics — localhost only.
    location = /metrics {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8003/metrics;
    }

    # Streamlit sidebar page-links are relative ("./Annotate"), so
    # clicking "Annotate" from /Annotate resolves to /Annotate/Annotate
    # and compounds on subsequent clicks. Collapse /X/X(/X...)? back to /X.
    location ~ ^/([^/]+)(?:/\1)+/?$ {
        return 302 /$1;
    }

    # Streamlit multi-page quirk: on page refresh / nav, the SPA fetches
    # /<PageName>/<internal>/* as relative URLs, and sometimes doubles
    # the page prefix (/Annotate/Annotate/_stcore/...) when Streamlit's
    # client miscomputes basePath behind a prefix-stripping proxy.
    # Strip ALL leading segments before the internal path.
    # Covers _stcore (health/host-config/ws), static (js/css/fonts),
    # component (custom components e.g. st_canvas), media, vendor.
    # Streamlit /media/ — hash-addressed, short-lived upstream. Cache
    # it at nginx so in-flight browser fetches survive MediaFileManager GC.
    location ~ /media/[a-f0-9]+\.(png|jpg|jpeg|webp|gif|svg)$ {
        auth_basic off;
        rewrite ^.*?(/media/.*)$ $1 break;
        proxy_pass             http://127.0.0.1:8503;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;

        proxy_cache            csai_media;
        proxy_cache_key        $uri;
        proxy_cache_valid      200 206 30m;
        proxy_cache_lock       on;
        proxy_ignore_headers   Cache-Control Expires Set-Cookie;
        add_header             X-Cache-Status $upstream_cache_status always;
    }

    location ~ /(_stcore|static|component|media|vendor)/ {
        auth_basic off;
        rewrite ^.*?(/(_stcore|static|component|media|vendor)/.*)$ $1 break;
        proxy_pass         http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # Streamlit UI — basic auth.
    location / {
        auth_basic           "CSAI-OCR";
        auth_basic_user_file /etc/nginx/.htpasswd-csai;

        proxy_pass         http://127.0.0.1:8503/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }
}
