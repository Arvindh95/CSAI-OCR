limit_req_zone $http_x_api_key     zone=csai_per_key:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=csai_per_ip:10m  rate=100r/m;

server {
    listen 80;
    server_name 173.212.247.3;

    access_log /var/log/nginx/csai-ocr.access.log;
    error_log  /var/log/nginx/csai-ocr.error.log;

    # Client API (versioned). Phase 4 wires /api/v1/* routes; 404 until then.
    location /api/v1/ {
        limit_req zone=csai_per_key burst=20 nodelay;
        limit_req zone=csai_per_ip  burst=30 nodelay;

        proxy_pass         http://127.0.0.1:8003/api/v1/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Request-Id $request_id;
        proxy_read_timeout 30s;
        client_max_body_size 20M;
    }

    # Legacy endpoints (current main.py). Remove after Phase 4 cutover.
    location ~ ^/(ocr|verify|health)$ {
        limit_req zone=csai_per_ip burst=30 nodelay;
        proxy_pass         http://127.0.0.1:8003;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 20M;
    }

    # Admin API — IP allowlist + app-level token (app token added Phase 5).
    location /admin/v1/ {
        allow 127.0.0.1;
        deny  all;

        proxy_pass         http://127.0.0.1:8003/admin/v1/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Request-Id $request_id;
        client_max_body_size 1M;
    }

    # FastAPI docs — allowlist only (leaks endpoint list).
    location ~ ^/(docs|redoc|openapi\.json)$ {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8003;
    }

    # Prometheus metrics — localhost only.
    location = /metrics {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8003/metrics;
    }

    # Streamlit multi-page quirk: on page refresh / nav, the SPA fetches
    # /<PageName>/<internal>/* as relative URLs, and sometimes doubles
    # the page prefix (/Annotate/Annotate/_stcore/...) when Streamlit's
    # client miscomputes basePath behind a prefix-stripping proxy.
    # Strip ALL leading segments before the internal path.
    # Covers _stcore (health/host-config/ws), static (js/css/fonts),
    # component (custom components e.g. st_canvas), media, vendor.
    location ~ /(_stcore|static|component|media|vendor)/ {
        auth_basic off;
        rewrite ^.*?(/(_stcore|static|component|media|vendor)/.*)$ $1 break;
        proxy_pass         http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # Streamlit UI — basic auth.
    location / {
        auth_basic           "CSAI-OCR";
        auth_basic_user_file /etc/nginx/.htpasswd-csai;

        proxy_pass         http://127.0.0.1:8503/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }
}
